name: Linux Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Keep complete history for corpus provenance and future lock checks.
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.0'
      - name: Prepare private test scratch
        run: |
          scratch="$(mktemp -d "$RUNNER_TEMP/witness.XXXXXXXX")"
          chmod 0700 "$scratch"
          printf 'TMPDIR=%s\n' "$scratch" >> "$GITHUB_ENV"
      - name: Download dependencies
        run: go mod download
      - name: Verify modules
        run: go mod verify
      - name: Check module tidiness
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: bash --noprofile --norc -eo pipefail .github/scripts/check-format.sh
      - name: Check publication hygiene
        run: go run ./tools/hygiene -check
      - name: Check vector integrity
        run: go run ./tools/vectors -check
      - name: Check dependency policy
        run: go test -mod=readonly ./internal/deppolicy -count=1 -timeout=1m -v
      - name: Check generic attribution metadata
        run: python3 .github/scripts/check-hygiene.py
      - name: Verify CI controls
        run: bash --noprofile --norc -eo pipefail .github/scripts/check-controls.sh
      - name: Report pending qualification specifications
        run: bash --noprofile --norc -eo pipefail .github/scripts/report-pending.sh
      - name: Verify pending reporter controls
        run: bash --noprofile --norc -eo pipefail .github/scripts/check-pending-controls.sh
      - name: Verify S3 transaction controls
        run: python3 .github/scripts/check-s3-controls.py
      - name: Test
        run: go test -mod=readonly ./... -count=1 -timeout=1m -v
